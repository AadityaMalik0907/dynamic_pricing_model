[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-pricing-optimization"
version = "0.1.0"
description = "Advisory demand forecasting and price recommendations for a hotel demo."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.8",
    "joblib==1.4.2",
    "numpy==2.2.3",
    "pandas==2.2.3",
    "plotly==6.0.0",
    "pydantic-settings==2.7.1",
    "scikit-learn==1.6.1",
    "streamlit==1.42.0",
    "uvicorn[standard]==0.34.0",
    "xgboost==2.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.7",
]

[project.scripts]
dynamic-pricing = "dynamic_pricing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
