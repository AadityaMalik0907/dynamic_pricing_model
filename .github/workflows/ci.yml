name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check formatting and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Check package imports
        run: python -c "from dynamic_pricing.api.main import app; from dynamic_pricing.settings import settings; assert app.title and settings.pricing_domain"
      - name: Run tests
        run: python -m pytest
